name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Label, comment on, and close stale issues
      pull-requests: write # Label, comment on, close, and convert stale pull requests to draft
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - id: stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          exempt-issue-labels: keep,security
          exempt-pr-labels: keep,security
          stale-issue-message: >-
            This issue has had no activity for 60 days. It will close in 14 days
            unless there is new activity. Add the `keep` label to exempt it.
          stale-pr-message: >-
            This pull request has had no activity for 30 days, so it has been
            converted to a draft. It will close in 14 days unless there is new
            activity. Mark it ready for review to keep it open, or add the `keep`
            label to exempt it.
          close-issue-message: This issue closed after 74 days without activity.
          close-pr-message: This pull request closed after 44 days without activity.

      - name: Convert newly stale pull requests to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALED: ${{ steps.stale.outputs.staled-issues-prs }}
        run: |
          echo "$STALED" | jq -r '.[] | select(.pull_request != null) | .number' |
          while read -r pr; do
            if [ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" = "false" ]; then
              gh pr ready "$pr" --undo
            fi
          done
